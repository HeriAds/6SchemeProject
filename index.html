<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WebGIS</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  [hidden]{display:none!important;}
  #map{position:absolute;inset:0;}
  .hud{position:absolute;top:10px;left:10px;z-index:5;max-width:min(330px,86vw);}
  .card{background:rgba(255,255,255,.96);backdrop-filter:blur(4px);
        border:1px solid #dfe3e6;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.14);
        overflow:hidden;}
  .hd{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;}
  .hd h1{font-size:15px;margin:0;line-height:1.2;color:#16211f;}
  .hd p{font-size:12px;margin:2px 0 0;color:#5c6b67;}
  .hd .tog{margin-left:auto;font-size:18px;color:#5c6b67;transition:transform .2s;}
  .body{padding:0 14px 14px;display:block;max-height:74vh;overflow:auto;}
  .body.hidden{display:none;}
  .sec{margin-top:12px;}
  .sec .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        color:#7c8a86;margin:0 0 7px;font-weight:600;}
  .btn3d{width:100%;padding:9px;border:1px solid #0e7c86;border-radius:9px;
        background:#0e7c86;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  .btn3d.off{background:#fff;color:#0e7c86;}
  .rowc{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;color:#16211f;}
  .rowc input{width:16px;height:16px;accent-color:#0e7c86;cursor:pointer;flex:none;}
  .rowc .nm{cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rowc.active{background:#1e6fd9;border-radius:6px;padding-left:6px;}
  .rowc.active .nm{color:#fff;font-weight:600;}
  .rowc.active .cnt{color:#dbeafe;}
  .grp{margin-top:6px;}
  .grph{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;font-weight:700;
        color:#16211f;background:#f1f5f4;border-radius:7px;cursor:pointer;user-select:none;}
  .grph input{width:16px;height:16px;accent-color:#0e7c86;cursor:pointer;flex:none;}
  .grph .car{font-size:11px;color:#5c6b67;width:12px;flex:none;transition:transform .15s;}
  .grph.closed .car{transform:rotate(-90deg);}
  .grph .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grph .gc{font-size:11px;color:#8a988f;font-weight:500;flex:none;}
  .grpb{padding-left:14px;border-left:2px solid #e3e9e7;margin-left:9px;}
  .grpb.hidden{display:none;}
  .sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15);}
  .cnt{font-size:11px;color:#8a988f;flex:none;}
  .zbtn{border:1px solid #cfd6d3;background:#fff;border-radius:6px;cursor:pointer;
        font-size:13px;line-height:1;padding:3px 7px;color:#5c6b67;flex:none;}
  .zbtn:hover{border-color:#0e7c86;color:#0e7c86;}
  select{width:100%;padding:7px;border:1px solid #cfd6d3;border-radius:8px;font-size:14px;background:#fff;color:#16211f;}
  .tools{display:flex;flex-wrap:wrap;gap:6px;}
  .tbtn{flex:1 1 30%;padding:7px 6px;border:1px solid #cfd6d3;border-radius:8px;
        background:#fff;color:#16211f;font-size:13px;cursor:pointer;}
  .tbtn.on{background:#f59e0b;border-color:#f59e0b;color:#fff;}
  .tbtn.clr{color:#b04a2f;}
  .maplibregl-popup{max-width:300px!important;}
  .pp-title{font-weight:700;font-size:13px;margin-bottom:6px;color:#0e7c86;}
  table.pp{border-collapse:collapse;font-size:12.5px;width:100%;}
  table.pp th{text-align:left;color:#5c6b67;font-weight:600;padding:2px 8px 2px 0;vertical-align:top;white-space:nowrap;}
  table.pp td{color:#16211f;padding:2px 0;word-break:break-word;}
  table.pp td.empty{color:#8a988f;font-style:italic;}
  .readout{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:9;
        background:rgba(20,30,28,.92);color:#fff;padding:8px 14px;border-radius:10px;
        font-size:13px;display:none;max-width:92vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .readout b{color:#ffcf7a;}
  .credit{position:absolute;bottom:0;right:0;z-index:5;font-size:10px;color:#333;
        background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px 0 0 0;}
  /* editor */
  .editbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:7;
        display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
        background:rgba(255,255,255,.96);border:1px solid #dfe3e6;border-radius:10px;
        padding:7px 10px;box-shadow:0 4px 16px rgba(0,0,0,.16);max-width:94vw;}
  .editbar button{padding:7px 11px;border:1px solid #cfd6d3;border-radius:8px;
        background:#fff;color:#16211f;font-size:13px;cursor:pointer;}
  .editbar button.pri{background:#0e7c86;border-color:#0e7c86;color:#fff;}
  .editbar button.on{background:#f59e0b;border-color:#f59e0b;color:#fff;}
  .editbar .who{font-size:12px;color:#0a6a2a;font-weight:600;}
  .lbox{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:8;
        background:#fff;border:1px solid #dfe3e6;border-radius:10px;padding:14px;
        box-shadow:0 6px 20px rgba(0,0,0,.2);width:min(280px,90vw);}
  .lbox h3{margin:0 0 10px;font-size:14px;}
  .lbox input{width:100%;padding:8px;margin-bottom:8px;border:1px solid #cfd6d3;
        border-radius:8px;font-size:14px;box-sizing:border-box;}
  .lbox .row{display:flex;gap:8px;justify-content:flex-end;}
  .lbox button{padding:7px 12px;border:1px solid #cfd6d3;border-radius:8px;background:#fff;cursor:pointer;}
  .lbox button.pri{background:#0e7c86;border-color:#0e7c86;color:#fff;}
  .lbox textarea{width:100%;min-height:56px;padding:8px;border:1px solid #cfd6d3;border-radius:8px;
        box-sizing:border-box;margin-bottom:8px;font-family:inherit;font-size:14px;}
  .lbox input[type=file]{width:100%;margin-bottom:8px;font-size:13px;}
  @media (max-width:520px){ .hud{max-width:calc(100vw - 20px);} }
</style>
</head>
<body>
<div id="map"></div>
<div class="hud">
  <div class="card">
    <div class="hd" id="hd">
      <div>
        <h1 id="ttl">WebGIS</h1>
        <p id="sub"></p>
      </div>
      <div class="tog" id="tog" style="transform:rotate(-90deg)">▾</div>
    </div>
    <div class="body hidden" id="panel">
      <div class="sec" id="sec3d">
        <button class="btn3d off" id="b3d">Tampilan 3D</button>
      </div>
      <div class="sec">
        <p class="lbl">Peta dasar</p>
        <select id="bm">
          <option value="osm">OpenStreetMap</option>
          <option value="sat">Citra Satelit</option>
          <option value="topo">Topografi</option>
        </select>
      </div>
      <div class="sec">
        <p class="lbl">Alat ukur</p>
        <div class="tools">
          <button class="tbtn" id="tDist">Jarak</button>
          <button class="tbtn" id="tArea">Luas</button>
          <button class="tbtn" id="tCoord">Koordinat</button>
          <button class="tbtn clr" id="tClear">Hapus</button>
        </div>
      </div>
      <div class="sec">
        <p class="lbl">Layer — klik nama untuk info di peta</p>
        <div id="layers"></div>
      </div>
    </div>
  </div>
</div>
<div class="readout" id="readout"></div>
<div class="credit" id="credit"></div>

<div class="editbar" id="editbar" hidden>
  <button id="eLogin" class="pri">🔑 Login editor</button>
  <span class="who" id="eWho" hidden></span>
  <span id="eTools" hidden></span>
  <button id="eDownload">⬇ GeoJSON</button>
  <button id="eLogout" hidden>Keluar</button>
  <span id="eDraw" hidden>
    <span id="eHint" style="font-size:12px;color:#555;"></span>
    <button id="eFinish" class="pri">Selesai</button>
    <button id="eCancel">Batal</button>
  </span>
</div>
<div class="lbox" id="ptbox" hidden>
  <h3>Titik baru</h3>
  <textarea id="ptNote" placeholder="Catatan (opsional)"></textarea>
  <input type="file" id="ptPhoto" accept="image/*" capture="environment">
  <div class="row">
    <button id="ptCancel">Batal</button>
    <button id="ptSave" class="pri">Simpan</button>
  </div>
</div>
<div class="lbox" id="lbox" hidden>
  <h3>Login Editor</h3>
  <input id="eEmail" type="email" placeholder="email tim" autocomplete="username">
  <input id="ePass" type="password" placeholder="password" autocomplete="current-password">
  <div class="row">
    <button id="eLoginCancel">Batal</button>
    <button id="eDoLogin" class="pri">Masuk</button>
  </div>
</div>

function resizeImage(file, maxDim, quality){
  return new Promise(function(res, rej){
    var url=URL.createObjectURL(file); var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height, s=Math.min(1, maxDim/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
      var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
      cv.getContext("2d").drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error("gagal memproses gambar")); }, "image/jpeg", quality||0.7);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("gagal membaca gambar")); };
    img.src=url;
  });
}

function setLayerVisible(L, on){
  var vis = on ? "visible" : "none";
  (L._render||[]).forEach(function(rid){
    if (map.getLayer(rid)) map.setLayoutProperty(rid, "visibility", vis);
  });
}
var _layerById = {};
CONFIG.layers.forEach(function(L){ _layerById[L.id] = L; });

function buildLayerList(){
  var box = document.getElementById("layers");
  box.innerHTML = "";
  var groups = CONFIG.groups;
  if (!groups || !groups.length){
    groups = [{name:"", ids:CONFIG.layers.map(function(L){ return L.id; })}];
  }
  groups.forEach(function(G){
    var ids = (G.ids||[]).filter(function(id){ return _layerById[id]; });
    if (!ids.length) return;
    if (!G.name){                       // tanpa grup -> baris datar
      ids.forEach(function(id){ box.appendChild(makeLayerRow(_layerById[id], null)); });
      return;
    }
    var wrap = document.createElement("div"); wrap.className = "grp";
    var hd = document.createElement("div"); hd.className = "grph";
    var gcb = document.createElement("input"); gcb.type = "checkbox"; gcb.checked = true;
    gcb.title = "Tampilkan / sembunyikan semua layer di grup ini";
    var car = document.createElement("span"); car.className = "car"; car.textContent = "▼";
    var gn = document.createElement("span"); gn.className = "gn"; gn.textContent = G.name;
    var gc = document.createElement("span"); gc.className = "gc"; gc.textContent = ids.length + " layer";
    hd.appendChild(gcb); hd.appendChild(car); hd.appendChild(gn); hd.appendChild(gc);
    var body = document.createElement("div"); body.className = "grpb";
    var childCbs = [];
    ids.forEach(function(id){
      var row = makeLayerRow(_layerById[id], function(){
        var n = childCbs.filter(function(c){ return c.checked; }).length;
        gcb.checked = n > 0; gcb.indeterminate = (n > 0 && n < childCbs.length);
      });
      var ccb = row.querySelector("input"); ccb._lid = id;
      childCbs.push(ccb); body.appendChild(row);
    });
    var _nOn = childCbs.filter(function(c){ return c.checked; }).length;
    gcb.checked = _nOn > 0;
    gcb.indeterminate = (_nOn > 0 && _nOn < childCbs.length);
    gcb.onclick = function(ev){ ev.stopPropagation(); };
    gcb.onchange = function(){
      var on = gcb.checked;
      childCbs.forEach(function(c){ c.checked = on; setLayerVisible(_layerById[c._lid], on); });
      gcb.checked = on; gcb.indeterminate = false;
    };
    hd.onclick = function(){ hd.classList.toggle("closed"); body.classList.toggle("hidden"); };
    wrap.appendChild(hd); wrap.appendChild(body); box.appendChild(wrap);
  });
}

function makeLayerRow(L, onToggle){
    var row = document.createElement("div");
    row.className = "rowc";
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = (L.on !== false);
    cb.onchange = function(){
      setLayerVisible(L, cb.checked);
      if (onToggle) onToggle();
    };
    var sw = document.createElement("span");
    sw.className = "sw"; sw.style.background = L.color;
    var nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = L.name; nm.title = "Klik untuk pilih layer ini (info di peta)";
    nm.onclick = function(){ setActiveLayer(L.id); };
    var ct = document.createElement("span"); ct.className = "cnt"; ct.textContent = L.count;
    var zb = document.createElement("button");
    zb.className = "zbtn"; zb.textContent = "⤢"; zb.title = "Zoom ke layer";
    zb.onclick = function(){
      if (L.bounds){ try{ map.fitBounds(L.bounds,{padding:60, maxZoom:17}); }catch(e){} }
    };
    row.appendChild(cb); row.appendChild(sw); row.appendChild(nm);
    row.appendChild(ct); row.appendChild(zb);
    _rowById[L.id] = row;
    return row;
}

var measureMode = null;   // 'dist' | 'area' | 'coord' | null
var mCoords = [];
var RO = document.getElementById("readout");

function fmtDist(km){
  return (km < 1) ? (km*1000).toFixed(1) + " m" : km.toFixed(3) + " km";
}
function fmtArea(m2){
  if (m2 < 10000) return m2.toFixed(1) + " m²";
  var ha = m2/10000;
  if (ha < 100) return ha.toFixed(3) + " ha (" + Math.round(m2).toLocaleString("id") + " m²)";
  return (m2/1e6).toFixed(3) + " km² (" + ha.toFixed(1) + " ha)";
}
function hint(){
  if (measureMode === "dist") return "Klik titik-titik untuk mengukur jarak. Tombol Hapus untuk mengulang.";
  if (measureMode === "area") return "Klik ≥3 titik untuk mengukur luas. Tombol Hapus untuk mengulang.";
  if (measureMode === "coord") return "Klik di peta untuk melihat koordinat.";
  return "";
}
function showReadout(html){ RO.innerHTML = html; RO.style.display = "block"; }

function updateMeasure(){
  var pts = {type:"FeatureCollection", features: mCoords.map(function(c){
    return {type:"Feature", geometry:{type:"Point", coordinates:c}}; })};
  var showPts = (measureMode === "area");   // jarak: garis saja, tanpa titik
  if (map.getSource("m-pts")) map.getSource("m-pts").setData(showPts ? pts : EMPTY);

  var geo = EMPTY;
  if (measureMode === "area" && mCoords.length >= 3){
    geo = {type:"Feature", geometry:{type:"Polygon", coordinates:[mCoords.concat([mCoords[0]])]}};
  } else if (mCoords.length >= 2){
    geo = {type:"Feature", geometry:{type:"LineString", coordinates:mCoords}};
  }
  if (map.getSource("m-line")) map.getSource("m-line").setData(geo);
  refreshReadout();
}
function refreshReadout(){
  if (measureMode === "dist" && mCoords.length >= 2){
    var km = turf.length({type:"Feature",geometry:{type:"LineString",coordinates:mCoords}},{units:"kilometers"});
    showReadout("Jarak: <b>"+fmtDist(km)+"</b>");
  } else if (measureMode === "area" && mCoords.length >= 3){
    var ring = mCoords.concat([mCoords[0]]);
    var a = turf.area({type:"Feature",geometry:{type:"Polygon",coordinates:[ring]}});
    var kel = turf.length({type:"Feature",geometry:{type:"LineString",coordinates:ring}},{units:"kilometers"});
    showReadout("Luas: <b>"+fmtArea(a)+"</b> &nbsp;·&nbsp; Keliling: <b>"+fmtDist(kel)+"</b>");
  } else if (measureMode){
    showReadout(hint());
  } else {
    RO.style.display = "none";
  }
}
function setMode(m){
  measureMode = (measureMode === m) ? null : m;
  ["tDist","tArea","tCoord"].forEach(function(id){ document.getElementById(id).classList.remove("on"); });
  if (measureMode === "dist") document.getElementById("tDist").classList.add("on");
  if (measureMode === "area") document.getElementById("tArea").classList.add("on");
  if (measureMode === "coord") document.getElementById("tCoord").classList.add("on");
  map.getCanvas().style.cursor = measureMode ? "crosshair" : "";
  mCoords = [];        // selalu bersihkan gambar tiap ganti alat (hindari sisa poligon)
  updateMeasure();
  refreshReadout();
}
document.getElementById("tDist").onclick  = function(){ setMode("dist"); };
document.getElementById("tArea").onclick  = function(){ setMode("area"); };
document.getElementById("tCoord").onclick = function(){ setMode("coord"); };
document.getElementById("tClear").onclick = function(){ mCoords = []; updateMeasure(); };

// muat pustaka Supabase HANYA saat dibutuhkan (agar tombol tetap muncul walau lambat)
var _sb = null, _sbLoading = null;
function ensureSb(){
  var E = CONFIG.edit;
  if (_sb) return Promise.resolve(_sb);
  if (_sbLoading) return _sbLoading;
  _sbLoading = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    s.onload = function(){
      try { _sb = window.supabase.createClient(E.url, E.key); res(_sb); }
      catch(e){ rej(e); }
    };
    s.onerror = function(){ rej(new Error("Gagal memuat pustaka Supabase (cek internet).")); };
    document.head.appendChild(s);
  });
  return _sbLoading;
}

var _editorReady = false;
function setupEditor(){

  var E = CONFIG.edit;

  map.addLayer({id:"ed-pt", type:"circle", source:"edits",
    filter:["==",["geometry-type"],"Point"],

           "circle-stroke-width":2,"circle-stroke-color":"#fff"}});

  // sumber pratinjau gambar
  map.addSource("draw", {type:"geojson", data:EMPTY});
  map.addLayer({id:"dr-fill", type:"fill", source:"draw",
    filter:["==",["geometry-type"],"Polygon"],
    paint:{"fill-color":"#f59e0b","fill-opacity":0.2}});
  map.addLayer({id:"dr-line", type:"line", source:"draw",
    paint:{"line-color":"#f59e0b","line-width":2.4,"line-dasharray":[2,1.2]}});

  var elBar=document.getElementById("editbar"),

  if (E.email) document.getElementById("eEmail").value=E.email;

  // tombol tambah sesuai tipe yang diizinkan
  var types = E.types || ["point","line","area"];
  var LB={point:"+ Titik", line:"+ Garis", area:"+ Area"};
  elTools.innerHTML="";

    b.onclick=function(){ startDraw(t, b); };

  function refreshUI(){

    elWho.hidden=!on;

    if(!on){ cancelDraw(); }
  }

  // ---- tampilkan bar SEGERA (tak menunggu Supabase termuat) ----
  refreshUI();

  // ---- login / logout (Supabase dimuat saat diklik) ----
  elLogin.onclick=function(){ elBox.hidden=false; };

    ensureSb().then(function(sb){ return sb.auth.signInWithPassword({email:email,password:pass}); })
      .then(function(r){

        if(r.error){
          alert("Login gagal: "+r.error.message+

      var rows=r.data||[];
      if(!rows.length){ alert("Belum ada objek editan untuk diunduh."); return; }
      var fc={type:"FeatureCollection", features: rows.map(function(row){
        return {type:"Feature",
                properties:{id:row.id, gtype:row.gtype, note:row.note,
                            photo:row.photo, created_at:row.created_at},
                geometry:row.geojson}; })};
      var blob=new Blob([JSON.stringify(fc)], {type:"application/geo+json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="webgis_edits.geojson";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    }).catch(function(e){ b.textContent=old; alert("Gagal: "+(e.message||e)); });
  };

  // ---- data editan + status login (dimuat di belakang) ----
  async function loadEdits(){
    try{
      var sb=await ensureSb();
      var r=await sb.from(TABLE).select("*");
      if(r.error){ console.warn(r.error.message); return; }
      var feats=(r.data||[]).map(function(row){
        return {type:"Feature",
                properties:{id:row.id, note:row.note, gtype:row.gtype, photo:row.photo},
                geometry:row.geojson};
      });
      if(map.getSource("edits"))
        map.getSource("edits").setData({type:"FeatureCollection", features:feats});
    }catch(e){ console.warn(e); }
  }
  ensureSb().then(function(sb){
    sb.auth.getSession().then(function(r){ session=r.data.session; refreshUI(); });
    sb.auth.onAuthStateChange(function(_e,s){ session=s; refreshUI(); });
    loadEdits();
    try{
      sb.channel("rt-"+TABLE).on("postgres_changes",
        {event:"*", schema:"public", table:TABLE}, loadEdits).subscribe();
    }catch(e){}
  }).catch(function(e){ console.warn(e); });

  // ---- popup objek editan (lihat / edit / hapus) ----
  ["ed-pt","ed-line","ed-fill"].forEach(function(lid){
    map.on("click", lid, function(e){
      if(drawType) return;
      if(!e.features||!e.features.length) return;
      var f=e.features[0]; var p=f.properties||{};
      var box=document.createElement("div");
      box.innerHTML="<div class='pp-title'>Catatan</div><div style='font-size:13px;max-width:240px'>"+
        esc(p.note||"(tanpa catatan)")+"</div>";
      if(p.photo){
        box.innerHTML += "<div style='margin-top:8px'><a href='"+esc(p.photo)+
          "' target='_blank' rel='noopener'><img src='"+esc(p.photo)+
          "' style='max-width:240px;width:100%;border-radius:6px'></a></div>";
      }
      if(session){
        var row=document.createElement("div"); row.style.marginTop="8px";
        var be=document.createElement("button"); be.textContent="Edit"; be.style.marginRight="6px";
        be.onclick=function(){ editNote(p.id, p.note); pop.remove(); };
        var bd=document.createElement("button"); bd.textContent="Hapus";
        bd.onclick=function(){ delFeature(p.id); pop.remove(); };
        row.appendChild(be); row.appendChild(bd); box.appendChild(row);
      }
      var pop=new maplibregl.Popup().setLngLat(e.lngLat).setDOMContent(box).addTo(map);
    });
    map.on("mouseenter", lid, function(){ if(!drawType) map.getCanvas().style.cursor="pointer"; });
    map.on("mouseleave", lid, function(){ if(!drawType) map.getCanvas().style.cursor=""; });
  });

  async function editNote(id, old){
    var n=prompt("Ubah catatan:", old||""); if(n===null) return;
    var sb=await ensureSb();
    var r=await sb.from(TABLE).update({note:n}).eq("id",id);
    if(r.error) alert("Gagal: "+r.error.message); else loadEdits();
  }
  async function delFeature(id){
    if(!confirm("Hapus objek ini?")) return;
    var sb=await ensureSb();
    var r=await sb.from(TABLE).delete().eq("id",id);
    if(r.error) alert("Gagal: "+r.error.message); else loadEdits();
  }

  // ---- menggambar objek baru ----
  function startDraw(t, btn){
    if(!session) return;
    drawType=t; drawCoords=[];
    [].forEach.call(elTools.querySelectorAll("button"),function(b){b.classList.remove("on");});
    if(btn) btn.classList.add("on");
    map.getCanvas().style.cursor="crosshair";
    elDraw.hidden=(t==="point");   // titik: langsung klik, tak perlu Selesai
    elHint.textContent = t==="point" ? "Klik lokasi titik" :
       (t==="line" ? "Klik tiap titik garis, lalu Selesai" :
                     "Klik ≥3 titik area, lalu Selesai");
    updateDraw();
  }
  function cancelDraw(){
    drawType=null; drawCoords=[]; elDraw.hidden=true;
    [].forEach.call(elTools.querySelectorAll("button"),function(b){b.classList.remove("on");});
    map.getCanvas().style.cursor="";
    if(map.getSource("draw")) map.getSource("draw").setData(EMPTY);
  }
  function updateDraw(){
    var g=EMPTY;
    if(drawType==="area" && drawCoords.length>=3)
      g={type:"Feature",geometry:{type:"Polygon",coordinates:[drawCoords.concat([drawCoords[0]])]}};
    else if(drawCoords.length>=2)
      g={type:"Feature",geometry:{type:"LineString",coordinates:drawCoords}};
    else if(drawCoords.length===1)
      g={type:"Feature",geometry:{type:"Point",coordinates:drawCoords[0]}};
    if(map.getSource("draw")) map.getSource("draw").setData(g);
  }
  elCancel.onclick=cancelDraw;
  elFinish.onclick=function(){
    if(drawType==="line" && drawCoords.length>=2)
      saveFeature("line",{type:"LineString",coordinates:drawCoords});
    else if(drawType==="area" && drawCoords.length>=3)
      saveFeature("area",{type:"Polygon",coordinates:[drawCoords.concat([drawCoords[0]])]});
    else alert("Titik belum cukup.");
  };
  var pendingCoord=null;
  var elPt=document.getElementById("ptbox"),
      ptNote=document.getElementById("ptNote"),
      ptPhoto=document.getElementById("ptPhoto");
  map.on("click", function(e){
    if(!drawType || !session) return;
    var c=[e.lngLat.lng, e.lngLat.lat];
    if(drawType==="point"){
      pendingCoord=c; ptNote.value=""; ptPhoto.value=""; elPt.hidden=false; return;
    }
    drawCoords.push(c); updateDraw();
  });
  document.getElementById("ptCancel").onclick=function(){ elPt.hidden=true; cancelDraw(); };
  document.getElementById("ptSave").onclick=async function(){
    var btn=this, old=btn.textContent; btn.disabled=true; btn.textContent="Menyimpan…";
    try{
      var note=ptNote.value||"";
      var photoUrl=null;
      var f=ptPhoto.files && ptPhoto.files[0];
      var sb=await ensureSb();
      if(f){
        btn.textContent="Mengunggah foto…";
        var blob=await resizeImage(f, 1280, 0.7);
        var path="p_"+Date.now()+"_"+Math.random().toString(36).slice(2)+".jpg";
        var up=await sb.storage.from("photos").upload(path, blob, {contentType:"image/jpeg", upsert:false});
        if(up.error){ throw new Error("Upload foto gagal: "+up.error.message+" (cek bucket 'photos' sudah dibuat)"); }
        photoUrl=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
      }
      var rec={gtype:"point", geojson:{type:"Point",coordinates:pendingCoord}, note:note};
      if(photoUrl) rec.photo=photoUrl;
      var r=await sb.from(TABLE).insert(rec);
      if(r.error) throw new Error(r.error.message);
      elPt.hidden=true; cancelDraw(); loadEdits();
    }catch(err){ alert("Gagal menyimpan titik: "+(err.message||err)); }
    finally{ btn.disabled=false; btn.textContent=old; }
  };
  async function saveFeature(gtype, geometry){
    var note=prompt("Catatan untuk "+gtype+":",""); if(note===null){ cancelDraw(); return; }
    var sb=await ensureSb();
    var r=await sb.from(TABLE).insert({gtype:gtype, geojson:geometry, note:note});
    cancelDraw();
    if(r.error) alert("Gagal menyimpan: "+r.error.message); else loadEdits();
  }
  } catch(err){
    console.error(err);
    alert("Mode edit gagal dimuat: " + (err && err.message ? err.message : err));
  }
}
</script>
</body>
</html>
